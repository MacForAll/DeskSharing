<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>DeskSharing – Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

    <div class="login-container">
        <img src="social-preview.png" alt="DeskSharing Banner" class="login-banner">

        <h1 class="login-title">DeskSharing</h1>

        <!-- LOGIN FORM -->
        <form id="loginForm">
            <input type="text" id="username" placeholder="Benutzername" required>
            <input type="password" id="password" placeholder="Passwort" required>

            <button type="submit" class="login-btn">Login</button>

            <div class="login-links">
                <button type="button" id="resetBtn" class="link-btn">Passwort zurücksetzen</button>
                <button type="button" id="forgotBtn" class="link-btn">Passwort vergessen?</button>
            </div>
        </form>

        <p id="loginMessage" class="login-message"></p>
    </div>

    <!-- USER PASSWORD CHANGE MODAL -->
    <div id="userPwModal" class="modal-overlay">
        <div class="modal-box">
            <h3>Neues Passwort setzen</h3>

            <label>Neues Passwort:</label>
            <input type="password" id="userNewPass1">

            <label>Wiederholen:</label>
            <input type="password" id="userNewPass2">

            <button onclick="confirmUserPasswordChange()">Speichern</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
